name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - name: dist/ matches the sources
        run: |
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            git status --short -- dist/
            echo "::error::dist/ is out of date. Run 'npm run package' and commit the result."
            exit 1
          fi

  # main -> heartbeat daemon -> release -> post as real processes against the
  # fake server, on every OS (PLAN §10.2; the fake-server half of E14).
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:integration
